server:
  port: 8081

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/postgres}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:9a7f47e3a9b1c7c8a6f4d5b6e7f8c9d0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours

ai:
  python-service-url: ${PYTHON_FACE_SERVICE_URL:http://localhost:8000}
