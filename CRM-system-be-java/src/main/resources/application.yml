server:
  port: 8081

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/postgres}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:9a7f47e3a9b1c7c8a6f4d5b6e7f8c9d0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours

ai:
  python-service-url: ${PYTHON_FACE_SERVICE_URL:http://localhost:8000}
  request-timeout-seconds: ${PYTHON_FACE_TIMEOUT_SECONDS:45}
  face-match:
    auto-accept-distance: ${FACE_AUTO_ACCEPT_DISTANCE:0.30}
    review-distance: ${FACE_REVIEW_DISTANCE:0.40}
    minimum-gap: ${FACE_MINIMUM_GAP:0.03}

experience:
  ema-alpha: ${EXPERIENCE_EMA_ALPHA:0.35}
  minimum-accepted-frames: ${EXPERIENCE_MINIMUM_ACCEPTED_FRAMES:3}
  transition-dwell-seconds: ${EXPERIENCE_TRANSITION_DWELL_SECONDS:2}
  engaged-dwell-seconds: ${EXPERIENCE_ENGAGED_DWELL_SECONDS:5}
  impatient-dwell-seconds: ${EXPERIENCE_IMPATIENT_DWELL_SECONDS:8}

app:
  demo:
    enabled: ${DEMO_DATA_ENABLED:false}
    manager-password: ${DEMO_MANAGER_PASSWORD:demo123}
  offers:
    import-enabled: ${OFFERS_IMPORT_ENABLED:false}
    xlsx-path: ${OFFERS_XLSX_PATH:../products.xlsx}
